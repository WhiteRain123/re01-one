      <p>漫步街头的闲逛者是波德莱尔眼中真正的诗人</p>

        color="#987cb9"

      <p>岁月不居，时节如流</p>
      <p>记忆若非时时拂拭，终会裹满时间的淤泥、黯淡难识</p>
      <p>一张照片就如同生命的航船在时间之海投下巨锚</p>
      <p>它的长索可以把我们一次次牵回锚点</p>
      <p>以免在记忆中刻舟求剑地追寻</p>
